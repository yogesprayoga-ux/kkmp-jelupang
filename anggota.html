<!DOCTYPE html>
<!--
  PORTAL KOPERASI KKMP JELUPANG - anggota, pengurus, pengawas (satu halaman, tampilan menyesuaikan peran).
  Buka lewat  alamat-website/anggota.html  (atau tombol Masuk di website).
  Memakai config.js dan akun Supabase yang sama dengan website. Jalankan 09_portal_koperasi.sql dulu.
-->
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#632B2B">
  <title>Portal Koperasi KKMP Jelupang</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --red: #B84435; --mar: #632B2B; --yel: #F6EB60; --ink: #272227; --mut: #6d6368; --line: #e6dfd8; --bg: #FFF9F0; --card: #fff; --ok: #1f7a3a; --warn: #b26a00; --bad: #b3261e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    body { font: 14px/1.5 Poppins, "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--ink); padding-bottom: env(safe-area-inset-bottom); }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--yel); outline-offset: 2px; box-shadow: 0 0 0 5px var(--mar); }
    .mut { color: var(--mut); font-size: 12.5px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px; border: 0; border-radius: 10px; background: var(--red); color: #fff; font-weight: 600; }
    .btn:hover { filter: brightness(1.08); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
    .btn.danger { background: var(--card); color: var(--bad); border: 1px solid #e8b9b5; }
    .btn.sm { padding: 5px 11px; font-size: 12.5px; border-radius: 8px; }
    .fld { margin-bottom: 12px; }
    .fld label { display: block; font-weight: 600; font-size: 12.5px; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d9d0c8; border-radius: 10px; background: #fff; }
    .msg { padding: 9px 12px; border-radius: 9px; font-size: 13px; margin-bottom: 12px; background: #fdecea; color: #8a1c14; border: 1px solid #f3c1bc; }
    .login { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .box { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; box-shadow: 0 10px 30px rgba(99, 43, 43, .08); }
    .box h1 { font-size: 20px; color: var(--mar); }
    .box p.mut { margin: 4px 0 18px; }
    .box .btn { width: 100%; }
    .tw { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
    th { background: #faf4ec; font-size: 12px; color: var(--mut); }
    td.r, th.r { text-align: right; }
    .in { color: var(--ok); font-weight: 600; } .out { color: var(--bad); font-weight: 600; } .late { color: var(--bad); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; }
    .card summary { cursor: pointer; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .card .tw { margin-top: 10px; } .card p { margin-top: 8px; }
    .card pre { white-space: pre-wrap; font: inherit; margin-top: 8px; }
    .chip { margin-left: auto; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 2px 10px; background: #eee; }
    .c-berjalan, .c-ditanggapi, .c-perhatian { background: #fff1d6; color: var(--warn); }
    .c-lunas, .c-selesai, .c-aktif { background: #dff3e4; color: var(--ok); }
    .c-ditolak, .c-temuan, .c-terbuka { background: #fdecea; color: var(--bad); }
    .c-dibatalkan, .c-keluar, .c-meninggal { background: #eee; color: #555; }
    .c-calon, .c-diajukan { background: #fff1d6; color: var(--warn); }
    .c-disetujui { background: #dff3e4; color: var(--ok); }
    .c-dibekukan, .c-diberhentikan { background: #fdecea; color: var(--bad); }
    .msg.ok { background: #e7f6ec; color: #17612f; border-color: #b9e2c6; }
    .box.wide { max-width: 560px; } .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .chk { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0; font-size: 13px; } .chk input { width: auto; margin-top: 3px; }
    .box a { color: var(--red); font-weight: 600; }
    .act { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .empty { padding: 28px; text-align: center; color: var(--mut); background: var(--card); border: 1px dashed var(--line); border-radius: 12px; }
    dialog::backdrop { background: rgba(39, 34, 39, .5); }
    dialog h3 { color: var(--mar); margin-bottom: 14px; }
    #toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 18px; border-radius: 999px; font-size: 13px; z-index: 50; }
      .shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }
    .side { position: sticky; top: 0; height: 100vh; background: var(--mar); color: #fff; padding: 18px 12px; display: flex; flex-direction: column; gap: 3px; overflow: auto; }
    .brand { font-weight: 700; font-size: 15px; line-height: 1.3; padding: 4px 10px 12px; }
    .side h6 { font-size: 11.5px; font-weight: 600; opacity: .65; margin: 14px 10px 4px; }
    .side button { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border: 0; border-radius: 10px; background: none; color: #f3e3e0; font-weight: 500; text-align: left; }
    .side button:hover { background: rgba(255, 255, 255, .1); }
    .side button.on { background: var(--yel); color: var(--mar); font-weight: 700; }
    .nb { margin-left: auto; font-style: normal; background: var(--red); color: #fff; border-radius: 99px; font-size: 11px; padding: 0 7px; }
    .main { min-width: 0; }
    .top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 12px 20px; padding-top: calc(12px + env(safe-area-inset-top)); background: rgba(255, 249, 240, .94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
    .top h1 { font-size: 18px; color: var(--mar); }
    .top .sp { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; }
    .av { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--mar); color: var(--yel); font-weight: 700; flex: none; }
    .av.big { width: 64px; height: 64px; font-size: 26px; }
    .role { background: var(--yel); color: var(--mar); font-weight: 700; font-size: 12px; border-radius: 999px; padding: 2px 11px; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
    .bar h2, .hero h2 { font-size: 20px; color: var(--mar); }
    .hero { margin-bottom: 16px; } .hero p { color: var(--mut); }
    .kps { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .kp { text-align: left; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--mar); border-radius: 12px; padding: 12px 14px; }
    button.kp:hover { border-color: var(--red); }
    .kp.warn { border-left-color: var(--warn); } .kp.bad { border-left-color: var(--bad); }
    .kp span { display: block; font-size: 12px; color: var(--mut); }
    .kp b { font-size: 19px; color: var(--mar); font-variant-numeric: tabular-nums; }
    .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 12px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
    .cols .panel { margin: 0; }
    .panel h3, h3.sec { font-size: 14px; color: var(--mar); margin-bottom: 10px; }
    h3.sec { margin: 18px 0 8px; } h4 { font-size: 13px; margin: 14px 0 6px; color: var(--mar); }
    .comp { display: flex; height: 16px; border-radius: 99px; overflow: hidden; background: #eee; }
    .lg { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12.5px; }
    .lg b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
    .prog { height: 10px; border-radius: 99px; background: #eee; margin: 8px 0; overflow: hidden; } .prog i { display: block; height: 100%; background: var(--ok); }
    .bars { display: flex; gap: 8px; height: 150px; }
    .bars > div { flex: 1; display: grid; grid-template-rows: auto 1fr auto; text-align: center; font-size: 11px; color: var(--mut); min-width: 0; }
    .bars .col { display: flex; align-items: flex-end; } .bars i { display: block; width: 100%; background: var(--red); border-radius: 6px 6px 0 0; }
    .todo { display: flex; justify-content: space-between; width: 100%; padding: 10px 12px; margin-bottom: 6px; border: 1px solid var(--line); background: #fffdf7; border-radius: 10px; font-weight: 600; text-align: left; }
    .todo:hover { border-color: var(--red); }
    .prof { display: flex; align-items: center; gap: 16px; }
    .dl { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; margin: 8px 0; } .dl dt { color: var(--mut); font-size: 12.5px; } .dl dd { overflow-wrap: anywhere; }
    .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
    .tools input[type=search] { flex: 1 1 220px; width: auto; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; } .tools .chips { margin: 0; }
    .chip2 { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 14px; font-size: 12.5px; font-weight: 600; }
    .chip2.on { background: var(--red); border-color: var(--red); color: #fff; }
    th button { border: 0; background: none; font: inherit; font-weight: 700; color: inherit; padding: 0; }
    tbody tr[data-a] { cursor: pointer; } tbody tr[data-a]:hover { background: #fffaf0; }
    tfoot td { font-weight: 700; background: #faf4ec; }
    .pg { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px; flex-wrap: wrap; }
    .sk { height: 84px; border-radius: 12px; margin-bottom: 12px; background: linear-gradient(90deg, #f0e8df, #faf4ec, #f0e8df) 0 0 / 200% 100%; animation: sh 1.2s infinite; }
    @keyframes sh { to { background-position: -200% 0; } }
    @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
    dialog { margin: auto; border: 0; border-radius: 16px; padding: 22px; max-height: 90vh; overflow: auto; width: min(560px, 94vw); }
    @media (max-width: 860px) {
      .shell { display: block; }
      .side { position: fixed; inset: auto 0 0 0; height: auto; z-index: 20; flex-direction: row; gap: 2px; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); overflow-x: auto; box-shadow: 0 -4px 18px rgba(0, 0, 0, .18); }
      .brand, .side h6 { display: none; }
      .side button { flex: none; width: auto; min-width: 66px; flex-direction: column; gap: 1px; padding: 6px 8px; font-size: 11px; text-align: center; }
      .nb { position: absolute; top: 0; right: 4px; margin: 0; }
      .top { padding: 10px 14px; } .top .who, .top .role { display: none; }
      main { padding: 14px 14px 92px; }
    }
    @media print { .side, .top, .tools, .chips, .btn, .pg, .todo { display: none !important; } .shell { display: block; } main { padding: 0; } }
  </style>
</head>
<body>
  <section class="login" id="login" hidden>
    <div class="box">
      <h1>Portal Koperasi KKMP Jelupang</h1>
      <p class="mut">Untuk anggota, pengurus, dan pengawas. Masuk dengan akun Anda, atau daftar bila belum menjadi anggota.</p>
      <p class="msg" id="lerr" role="alert" hidden></p>
      <form id="lform">
        <div class="fld"><label for="em">Email</label><input id="em" type="email" required autocomplete="username"></div>
        <div class="fld"><label for="pw">Kata sandi</label><input id="pw" type="password" required autocomplete="current-password"></div>
        <button class="btn" id="lbtn">Masuk</button>
      </form>
      <p class="mut" style="margin-top:14px"><a href="#" id="lreg">Daftar akun baru</a> · <a href="#" id="lforgot">Lupa kata sandi?</a> · <a href="index.html">Kembali ke website</a></p>
    </div>
  </section>
  <section class="login" id="apply" hidden><div class="box wide"></div></section>

  <div id="app" class="shell" hidden>
    <nav class="side" id="side" aria-label="Menu utama"></nav>
    <div class="main">
      <header class="top"><h1 id="pt"></h1>
        <div class="sp"><span class="av" id="av"></span><b class="who" id="who"></b><span class="role" id="role"></span><button class="btn ghost sm" id="out">Keluar</button></div>
      </header>
      <main id="view"></main>
    </div>
  </div>

  
<dialog id="dlg"><h3 id="dt"></h3><form id="df"></form></dialog>
  <div id="toast" hidden></div>

  <script src="config.js"></script>
  <script>
  (() => {
    const CFG = window.KKMP_CONFIG || {}, BASE = String(CFG.SUPABASE_URL || "").replace(/\/+$/, ""), KEY = CFG.SUPABASE_ANON_KEY || "", SK = "kkmp_session";
    const $ = (s) => document.querySelector(s);
    const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    const rp = (n) => "Rp" + Math.round(+n || 0).toLocaleString("id-ID");
    const dd = (v) => (v ? new Date(v).toLocaleDateString("id-ID", { dateStyle: "medium" }) : "-");
    const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
    const ld = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
    let S = ld(SK), me = null, D = {}, view = "ringkas", staff = false, wr = false, pw = false, adm = false, ma = false;

    // ---------- API (pola sama dengan mitra.html) ----------
    const saveS = (d) => { S = { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600), email: (d.user && d.user.email) || (S && S.email) || "" }; try { localStorage.setItem(SK, JSON.stringify(S)); } catch (e) {} };
    const clearS = () => { S = null; try { localStorage.removeItem(SK); } catch (e) {} };
    async function errMsg(r) { try { const j = await r.json(); return j.message || j.msg || j.error_description || r.statusText; } catch (e) { return r.statusText || "Terjadi kesalahan"; } }
    async function token() {
      if (!S) throw new Error("Belum masuk");
      if (S.expires_at - 60 < Date.now() / 1000) {
        const r = await fetch(`${BASE}/auth/v1/token?grant_type=refresh_token`, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify({ refresh_token: S.refresh_token }) });
        if (!r.ok) { clearS(); showLogin("Sesi berakhir, silakan masuk lagi."); throw new Error("Sesi berakhir"); }
        saveS(await r.json());
      }
      return S.access_token;
    }
    async function api(method, path, body) {
      const t = await token();
      let r;
      try { r = await fetch(BASE + path, { method, headers: { apikey: KEY, Authorization: "Bearer " + t, "Content-Type": "application/json", Prefer: "return=representation" }, body: body === undefined ? undefined : JSON.stringify(body) }); }
      catch (e) { throw new Error("Tidak ada koneksi internet"); }
      if (!r.ok) throw new Error(await errMsg(r));
      const x = await r.text();
      return x ? JSON.parse(x) : null;
    }
    const rpc = (n, a) => api("POST", "/rest/v1/rpc/" + n, a);
    const toast = (m) => { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 2600); };

    // ---------- Masuk ----------
    function showLogin(m, good) { $("#app").hidden = true; $("#apply").hidden = true; $("#login").hidden = false; const e = $("#lerr"); e.hidden = !m; e.textContent = m || ""; e.classList.toggle("ok", !!good); }
    $("#lform").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const b = $("#lbtn"); b.disabled = true; b.textContent = "Memeriksa…";
      try {
        if (!BASE || !KEY) throw new Error("config.js belum diisi.");
        const r = await fetch(`${BASE}/auth/v1/token?grant_type=password`, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify({ email: $("#em").value.trim(), password: $("#pw").value }) });
        if (!r.ok) throw new Error(r.status === 400 ? "Email atau kata sandi salah." : await errMsg(r));
        saveS(await r.json()); $("#pw").value = "";
        await boot();
      } catch (e) { showLogin(e.message); }
      finally { b.disabled = false; b.textContent = "Masuk"; }
    });
    $("#out").addEventListener("click", () => { clearS(); showLogin(); });

    async function getAll(path) {   // ambil semua halaman (batas bawaan server 1000 baris)
      let out = [], from = 0;
      for (;;) {
        const t = await token(), r = await fetch(BASE + path, { headers: { apikey: KEY, Authorization: "Bearer " + t, "Range-Unit": "items", Range: from + "-" + (from + 999) } });
        if (r.status === 416) return out;
        if (!r.ok) throw new Error(await errMsg(r));
        const a = await r.json(); out = out.concat(a);
        if (a.length < 1000) return out; from += 1000;
      }
    }
    async function boot() {
      const a = await rpc("my_access", {});
      adm = !!a.admin; me = a.coop;
      if (!me && adm) me = { id: null, peran: "admin", name: (S && S.email) || "Admin", no: "admin" };
      if (!me) return showApply(a);
      staff = me.peran !== "anggota" || adm; wr = me.peran === "pengurus"; pw = me.peran === "pengawas"; ma = wr || adm;
      $("#login").hidden = true; $("#apply").hidden = true; $("#app").hidden = false;
      $("#who").textContent = me.name; $("#role").textContent = me.id ? me.peran + (me.tipe === "luar_biasa" ? " · luar biasa" : "") : "admin";
      $("#av").textContent = (me.name || "?").trim()[0].toUpperCase();
      view = "ringkas"; D = null; draw();
      await refresh();
    }
    // ---------- Pendaftaran, status calon anggota, atur ulang kata sandi ----------
    const REG = `<h1>Pendaftaran anggota</h1><p class="mut">Lengkapi data berikut. Data pribadi hanya dapat dilihat pengurus koperasi dan dipakai untuk verifikasi keanggotaan.</p><p class="msg" id="aerr" hidden></p>
      <form id="aform"><div class="fld"><label>Nama lengkap (sesuai KTP)</label><input name="name" required></div>
      <div class="fld"><label>NIK (16 digit)</label><input name="nik" required inputmode="numeric" pattern="[0-9]{16}" maxlength="16"></div>
      <div class="grid2"><div class="fld"><label>Tempat lahir</label><input name="bp" required></div><div class="fld"><label>Tanggal lahir</label><input name="bd" type="date" required></div></div>
      <div class="fld"><label>Pekerjaan</label><input name="job"></div>
      <div class="fld"><label>Alamat (jalan/gang dan nomor)</label><input name="addr" required></div>
      <div class="grid2"><div class="fld"><label>RT</label><input name="rt" required inputmode="numeric" pattern="[0-9]{1,3}"></div><div class="fld"><label>RW</label><input name="rw" required inputmode="numeric" pattern="[0-9]{1,3}"></div></div>
      <div class="fld"><label>Telepon / WhatsApp</label><input name="tel" required inputmode="tel"></div>
      <label class="chk"><input type="checkbox" name="decl" required> Saya warga negara Indonesia, cakap melakukan tindakan hukum, dan berdomisili di Kelurahan Jelupang, Kecamatan Serpong Utara.</label>
      <label class="chk"><input type="checkbox" name="cons" required> Saya menyetujui data pribadi saya diproses koperasi untuk keperluan keanggotaan.</label>
      <button class="btn" id="abtn">Kirim pendaftaran</button></form>`;
    function showApply(a) {
      $("#login").hidden = true; $("#app").hidden = true; $("#apply").hidden = false;
      const ap = a.apply, mb = a.member; let h;
      if (mb) h = `<h1>Status keanggotaan</h1><p class="msg ok">${esc(mb.name)} (${esc(mb.no)}): <b>${esc(mb.status)}</b>${mb.note ? " – " + esc(mb.note) : ""}</p>` + (mb.status === "calon" ? '<p class="mut">Pendaftaran Anda disetujui. Pengurus akan memverifikasi domisili dan mencatat simpanan pokok, lalu mengaktifkan keanggotaan Anda.</p>' : '<p class="mut">Hubungi pengurus untuk informasi lebih lanjut.</p>');
      else if (ap && ap.status === "diajukan") h = `<h1>Pendaftaran sedang diperiksa</h1><p class="msg ok">Diajukan ${dd(ap.at)}. Pengurus akan menghubungi Anda.</p>`;
      else h = (ap && ap.status === "ditolak" ? `<p class="msg">Pendaftaran sebelumnya ditolak: ${esc(ap.note || "-")}. Anda dapat mengajukan kembali.</p>` : "") + REG;
      $("#apply .box").innerHTML = h + '<p class="mut" style="margin-top:14px"><a href="#" id="aout">Keluar</a> · <a href="index.html">Kembali ke website</a></p>';
    }
    function showReset() {
      $("#login").hidden = true; $("#app").hidden = true; $("#apply").hidden = false;
      $("#apply .box").innerHTML = '<h1>Atur kata sandi baru</h1><p class="msg" id="aerr" hidden></p><form id="rform"><div class="fld"><label>Kata sandi baru (minimal 8 karakter)</label><input name="pw" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn" id="abtn">Simpan kata sandi</button></form>';
    }
    function handleHash() {   // tautan konfirmasi email / atur ulang kata sandi dari Supabase
