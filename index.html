<!DOCTYPE html>
<!--
  KKMP JELUPANG - Website lengkap 5 halaman (Beranda, Profil, Katalog, Kemitraan, Informasi & Kontak)

  STRUKTUR FOLDER (unggah ketiganya bersama, dengan susunan yang sama):
      index.html   = kerangka halaman, data SITE (contoh/cadangan), dan JavaScript (file ini)
      style.css    = seluruh tampilan (warna ada di bagian 1, paling atas)
      admin.html   = panel admin (login, kelola produk, mitra, pengumuman, dokumentasi)
      config.js    = alamat dan kunci publik Supabase
      supabase/    = skrip SQL (01_setup, 02_seed, 03_seed_situs); tidak perlu diunggah ke hosting
      assets/      = tempat foto dan logo milik sendiri

  UBAH   : Warna di style.css (bagian 1).
           Seluruh teks, gambar, produk, mitra, berita, dan kontak di blok "SITE" (bagian 2, di bawah).
  GAMBAR : Kolom img / logo / mapImg menerima:
             - file di folder assets   ->  "assets/logo.png", "assets/hero-beranda.jpg"
             - alamat gambar publik    ->  "https://..."
             - tautan berbagi Google Drive (otomatis dikonversi; file harus dibagikan ke "Siapa saja yang memiliki link")
           Tersedia di: brand.logo, mapImg, hero.img, dan setiap item (nodes, tiles, people, ident, posts,
           katalog, direktori mitra). Kosong atau gagal dimuat = kotak gambar kosong (blank).
           Format yang dikenali untuk file lokal: png, jpg, jpeg, gif, webp, svg, avif.
  PETA   : Buka Google Maps > cari lokasi > Bagikan > Sematkan peta > Salin HTML.
           Tempel (boleh seluruh kode <iframe ...> atau hanya alamat src-nya) ke:
             mapEmbed      = peta jaringan usaha mitra (Beranda & Kemitraan)
             mapEmbedKkmp  = peta lokasi KKMP di halaman Informasi & Kontak (kosong = memakai mapEmbed)
           Kosong = peta ilustratif (kotak kosong + pin contoh).
  TAUTAN : Isi nama halaman (beranda, profil, katalog, kemitraan, kontak),
           atau alamat https://..., atau "" (nonaktif).
  DINAMIS: Isi config.js (alamat dan kunci Supabase) agar produk, mitra, pengumuman, dokumentasi, serta
           menu, hero, profil, visi-misi, FAQ, kontak, footer, dan pin peta dibaca dari database dan dikelola lewat admin.html. config.js kosong = memakai data contoh di blok SITE.
           Langkah lengkap ada di PANDUAN.md.
  UJI    : Buka index.html langsung di browser, atau di VS Code gunakan ekstensi "Live Server".

  Jangan ubah apa pun di bawah garis "JANGAN UBAH".
-->

  <script src="config.js"></script>
  <script>
  /* ===================== JANGAN UBAH di bawah garis ini ===================== */

  const S = SITE;
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => [...document.querySelectorAll(s)];
  const PG = ["beranda", "profil", "katalog", "kemitraan", "kontak"];

  // ----- Helper: alamat gambar, escape HTML, gambar, dan tautan -----
  const imgSrc = (u) => {
    u = String(u == null ? "" : u).trim();
    if (!u) return "";
    // Tautan berbagi Google Drive otomatis diubah menjadi alamat gambar langsung
    const m =
      u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) ||
      u.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([\w-]+)/);
    if (m) return "https://lh3.googleusercontent.com/d/" + m[1];
    // alamat publik, data:image, atau file lokal (mis. assets/logo.png)
  const local = /^(\.{0,2}\/)?[\w\-./%]+\.(png|jpe?g|gif|webp|svg|avif)$/i;
  return /^(https?:)?\/\/|^data:image\//i.test(u) || local.test(u) ? u : "";
  };

  const esc = (t) =>
    String(t == null ? "" : t).replace(
      /[&<>"]/g,
      (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]
    );

  // <img> hanya dibuat jika alamat valid; jika gagal dimuat, <img> dihapus (kotak kosong tetap tampil)
  const imgTag = (src) =>
    imgSrc(src)
      ? `<img src="${esc(imgSrc(src))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`
      : "";

  // pic = gambar dengan emoji cadangan | bpic = kotak gambar kosong (tanpa ikon)
  const pic = (src, em, cls = "") =>
    `<div class="pic ${cls}"><span class="em">${em || ""}</span>${imgTag(src)}</div>`;
  const bpic = (src, cls = "") => `<div class="pic blank ${cls}">${imgTag(src)}</div>`;

  // l = nama halaman | alamat https://... | "" (nonaktif)
  const lk = (l) =>
    !l
      ? 'href="#" data-none'
      : PG.includes(l)
        ? `href="#/${l}" data-pg="${l}"`
        : /^\s*(javascript|data|vbscript):/i.test(l)
          ? 'href="#" data-none'
          : `href="${esc(l)}" target="_top" rel="noopener"`;

  const btn = (b, c) => (b ? `<a class="btn ${c}" ${lk(b[1])}>${esc(b[0])}</a>` : "");
  const more = (m) => (m ? `<a class="more" ${lk(m[1])}>${esc(m[0])}</a>` : "");

  const head = (b) =>
    b.title
      ? `<div class="row">
          <div>
            ${b.label ? `<div class="lab">${esc(b.label)}</div>` : ""}
            <h2>${esc(b.title)}</h2>
            ${b.sub ? `<p class="nt" style="margin-top:4px">${esc(b.sub)}</p>` : ""}
          </div>
          ${more(b.more)}
        </div>`
      : "";

  // ambil ID video dari tautan YouTube (watch, youtu.be, embed, shorts, live)
  const ytId = (u) => {
    const m = String(u || "").match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
    return m ? m[1] : "";
  };
  const sec = (b, x) =>
    `<section class="${b.cls || ""}">
      <div class="wrap">
        ${head(b)}
        ${x}
        ${b.note ? `<p class="nt">${esc(b.note)}</p>` : ""}
      </div>
    </section>`;

  const txt = (b) =>
    `<div>
      ${b.label ? `<div class="lab">${esc(b.label)}</div>` : ""}
      <h2>${esc(b.title)}</h2>
      <p class="tx">${esc(b.text)}</p>
      ${btn(b.btn, "b-red")}
    </div>`;

  const card = (c) =>
    `<div class="c1">
      ${c.num ? `<span class="n">${c.num}</span>` : ""}
      ${c.emoji ? `<span class="em">${c.emoji}</span>` : ""}
      <b${c.num ? ' style="padding-right:26px"' : ""}>${esc(c.title)}</b>
      ${c.text ? `<small>${esc(c.text)}</small>` : ""}
    </div>`;

  // ----- Peta: sematan Google Maps, atau peta ilustratif (kotak kosong + pin) -----
  // Hanya alamat sematan resmi Google Maps yang diterima (boleh ditempel sebagai kode <iframe> utuh)
  const mapSrc = (v) => {
    if (!v) return "";
    const m = String(v).match(/src\s*=\s*["']([^"']+)["']/i);
    const u = (m ? m[1] : String(v)).trim().replace(/&amp;/g, "&");
    const valid =
      /^https:\/\/(www\.)?google\.[a-z.]+\/maps\/embed/i.test(u) ||
      /^https:\/\/maps\.google\.[a-z.]+\/maps.*output=embed/i.test(u) ||
      /^https:\/\/(www\.)?google\.[a-z.]+\/maps.*output=embed/i.test(u);
    return valid ? u : "";
  };

  const mapH = (pins, one) => {
    const em = mapSrc(one ? S.mapEmbedKkmp || S.mapEmbed : S.mapEmbed);
    if (em) {
      return `<div class="map">
        <iframe src="${esc(em)}" title="${esc(S.ui.mapTitle)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      </div>`;
    }
    const pin = (q) =>
      q.kind === "kkmp"
        ? `<span class="pin k" style="left:${q.x}%;top:${q.y}%">${esc(q.name)}</span>`
        : `<button class="pin d" data-k="${q.kind}" data-n="${esc(q.name)}" data-f="${esc(q.info || "")}" style="left:${q.x}%;top:${q.y}%" aria-label="${esc(q.name)}"><i></i></button>`;
    return `<div class="map">
      ${bpic(S.mapImg)}
      ${pins.map(pin).join("")}
      <div class="pop"></div>
      <span style="position:absolute;left:10px;bottom:6px;font-size:10px;color:#6d6368">${esc(S.mapNote)}</span>
    </div>`;
  };

  // ----- State halaman -----
  let cur = "beranda";
  let Q = "";
  let CF = "";
  let SORT = "new";
  let PF = "";

  // ----- Renderer tiap jenis blok (cocokkan dengan t: "..." pada data SITE) -----
  const R = {
    strip: (b) =>
      `<div class="wrap quick">
        <div class="qg">${b.items
          .map(
            (q) => `
          <a class="q" ${lk(q.link)}>
            <span class="em">${q.emoji}</span>
            <span><b>${esc(q.title)}</b><small>${esc(q.sub)}</small></span>
          </a>`
          )
          .join("")}
        </div>
      </div>`,

    ustrip: () => {
      const u = UNITS.items;
      return `<div class="wrap quick"><div class="qg q7">${u
        .map(
          (c) => `
          <a class="q" ${lk(c.link)} title="${esc(c.title)}">
            <span class="em">${esc(c.emoji)}</span>
            <b>${esc(c.short || c.title)}</b>
          </a>`
        )
        .join("")}</div></div>`;
    },

    split: (b) =>
      sec(
        { cls: b.cls },
        `<div class="sg">
          ${txt(b)}
          <div class="cd">${b.items.map(card).join("")}</div>
        </div>`
      ),

    cards: (b) =>
      sec(
        b,
        `<div class="cd${b.num ? " n" : ""}">${b.items
          .map((c, i) => card({ ...c, num: b.num ? i + 1 : 0 }))
          .join("")}</div>`
      ),

    nodes: (b) =>
      sec(
        { cls: b.cls },
        `<div class="sg">
          ${txt(b)}
          <div>
            <div class="nodes">${b.items
              .map(
                (n, i) =>
                  `${i ? '<span class="arr" aria-hidden="true">⇄</span>' : ""}
              <button class="nd${i === 1 ? " on" : ""}" data-d="${esc(n.desc)}">
                ${pic(n.img, n.emoji)}
                <b>${esc(n.title)}</b>
                <small>${esc(n.sub)}</small>
              </button>`
              )
              .join("")}
            </div>
            <div class="link"><span>${esc(b.pill)}</span></div>
            <p class="ncap">${esc(((b.items[1] || b.items[0]) || {}).desc)}</p>
          </div>
        </div>`
      ),

    tiles: (b) =>
      sec(
        b,
        `<div class="tg ${b.side ? "side" : ""}">${b.items
          .map(
            (c) => `
          <a class="cat" ${lk(c.link)}>
            ${bpic(c.img)}
            ${c.title ? `<div class="bd"><b>${esc(c.title)}</b><small>${esc(c.sub)}</small></div>` : ""}
          </a>`
          )
          .join("")}
          ${
            b.side
              ? `<div class="sd">
            <span class="em">${b.side.emoji}</span>
            <b>${esc(b.side.title)}</b>
            <small>${esc(b.side.text)}</small>
            ${btn(b.side.btn, "b-red")}
          </div>`
              : ""
          }
        </div>`
      ),

    units: (b) => {
      const u = { cls: b.cls, ...UNITS };
      return sec(
        u,
        `<div class="cd un">${u.items
          .map(
            (c) => `<a class="c1" ${lk(c.link)}>
            <span class="em">${esc(c.emoji)}</span>
            <b>${esc(c.title)}</b>
            <small>${esc(c.text)}</small>
          </a>`
          )
          .join("")}</div>`
      );
    },

    ident: (b) =>
      sec(
        { ...b, note: "" },
        `<div class="idg">
          <div class="vp">${
            ytId(b.video)
              ? `<iframe src="https://www.youtube-nocookie.com/embed/${ytId(b.video)}" title="${esc(S.ui.videoTitle)}" loading="lazy" allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`
              : `<div class="vph"><span class="em">▶️</span><b>${esc(S.ui.videoSoon)}</b><small>${esc(S.ui.videoSoonSub)}</small></div>`
          }</div>
          <div>${b.rows
            .map(
              (r) => `
            <div class="ir">
              <span class="em">${r[0]}</span>
              <b>${esc(r[1])}</b>
              <span>${esc(r[2])}</span>
            </div>`
            )
            .join("")}
          </div>
        </div>`
      ),

    people: (b) =>
      sec(
        b,
        `<div class="tg">${b.items
          .map(
            (p) => `
          <div class="pp">
            ${bpic(p.img)}
            <b>${esc(p.name)}</b>
            <small>${esc(p.sub)}</small>
          </div>`
          )
          .join("")}

      ),

    map: (b) =>
      sec(
        { cls: b.cls },

          ${txt(b)}

          ${
            b.side

            <span class="em">${b.side.emoji}</span>

            <a class="more" ${lk(b.side.btn[1])}>${esc(b.side.btn[0])}</a>
          </div>`
              : `<div>
            <div class="leg">${b.legend
              .map((l, i) => `<span class="${["", "k", "w"][i] || ""}">${esc(l)}</span>`)

      sec(
        b,
        b.big
          ? `<div class="ps">${b.items
              .map(
                (p) => `
            <a class="po" ${lk(p.link)}>
              <div class="pic blank" style="height:112px">${imgTag(p.img)}<span class="tag r">${esc(p.tag)}</span></div>

              .map(

  // ----- Sematan (embed): hanya sumber tepercaya yang diterima -----
  const embedSrc = (v) => {
    v = String(v || "").trim();
    if (!v) return null;
    const m = v.match(/src\s*=\s*["']([^"']+)["']/i);
    const u = (m ? m[1] : v).trim().replace(/&amp;/g, "&");
    const y = ytId(u);
    if (y) return { src: "https://www.youtube-nocookie.com/embed/" + y, kind: "video" };
    const mp = mapSrc(u);
    if (mp) return { src: mp, kind: "map" };
    const vm = u.match(/^https:\/\/(?:www\.)?vimeo\.com\/(?:video\/)?(\d+)/i) || u.match(/^https:\/\/player\.vimeo\.com\/video\/(\d+)/i);
    if (vm) return { src: "https://player.vimeo.com/video/" + vm[1], kind: "video" };
    if (/^https:\/\/docs\.google\.com\/forms\/d\/e\/[\w-]+\/viewform/i.test(u))
      return { src: /embedded=true/.test(u) ? u : u + (u.includes("?") ? "&" : "?") + "embedded=true", kind: "form" };
    return null;
  };

  // Urutan dan visibilitas blok: p.order (dari database) menentukan blok yang tampil; p.custom = bagian tambahan
  function layoutBlocks(p) {
    let L = p.blocks;
    if (Array.isArray(p.order) && p.order.length) {
      const by = {};
      p.blocks.forEach((b) => (by[b.t] = b));
      L = p.order.map((t) => by[t]).filter(Boolean);
    }
    const cs = (Array.isArray(p.custom) ? p.custom : [])
      .filter((c) => c && (c.title || c.text || c.img || c.embed))
      .map((c) => ({ ...c, t: "custom" }));
    const known = new Set(L.map((b) => b.t));
    const out = cs.filter((c) => !c.after);
    L.forEach((b) => {
      out.push(b);
      cs.filter((c) => c.after === b.t).forEach((c) => out.push(c));
    });
    cs.filter((c) => c.after && !known.has(c.after)).forEach((c) => out.push(c));
    return out;
  }

  function applyTheme() {
    const t = S.theme || {}, r = document.documentElement.style;
    ["red", "yel", "mar", "off", "canvas", "sand", "ink", "mut", "pink", "cream"].forEach((k) => {
      if (/^#[0-9a-f]{3,8}$/i.test(t[k] || "")) r.setProperty("--" + k, t[k]);
    });
    const f = String(t.font || "").trim();
    if (f && f !== "Poppins" && /^[\w ]+$/.test(f)) {
      const l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(f).replace(/%20/g, "+") + ":wght@400;500;600;700;800&display=swap";
      document.head.appendChild(l);
      document.body.style.fontFamily = `"${f}",Poppins,'Segoe UI',Arial,sans-serif`;
    }
    document.title = S.brand.siteTitle || S.brand.name || document.title;
    const fav = imgSrc(S.brand.favicon);
    const href = fav || "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">${S.brand.emoji || "🏠"}</text></svg>`);
    let ic = document.querySelector("link[rel~=icon]");
    if (!ic) {
      ic = document.createElement("link");
      ic.rel = "icon";
      document.head.appendChild(ic);
    }
    ic.href = href;
  }

      ${p ? `<p>${esc(p.textContent)}</p>` : ""}
      <p>${esc(S.ui.detailNote)}</p>
      <a class="btn b-red" ${lk("kontak")} onclick="closeMod()">${esc(S.ui.detailBtn)}</a>`);
  }
  // ----- Masuk: arahkan ke portal sesuai peran (admin / pengelola mitra) -----
  const SK = "kkmp_session";
  const getSess = () => { try { return JSON.parse(localStorage.getItem(SK)); } catch (e) { return null; } };
  async function authCall(path, body) {
    const r = await fetch(`${BASE}/auth/v1/${path}`, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(r.status === 400 ? "Email atau kata sandi salah." : "Gagal masuk. Coba lagi.");
    const d = await r.json();
    const s = { access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at || Math.floor(Date.now() / 1000) + (d.expires_in || 3600), email: (d.user && d.user.email) || "" };
    localStorage.setItem(SK, JSON.stringify(s));
    return s;
  }
  async function myAccess(s) {
    if (s.expires_at - 60 < Date.now() / 1000) s = await authCall("token?grant_type=refresh_token", { refresh_token: s.refresh_token });
    const r = await fetch(`${BASE}/rest/v1/rpc/my_access`, { method: "POST", headers: { apikey: KEY, Authorization: "Bearer " + s.access_token, "Content-Type": "application/json" }, body: "{}" });
    if (!r.ok) throw new Error("Belum dapat memeriksa hak akses.");
    return r.json();
  }
  function showPortals(a, email) {
    const c = [];
    if (a.admin) c.push(["Kelola website", "admin.html"]);
    if (a.coop) c.push(["Portal koperasi (" + a.coop.peran + ")", "anggota.html"]);
    (a.stores || []).forEach((s) => c.push(["Kasir & stok: " + s.name, "mitra.html?toko=" + s.id]));
    if (!c.length) c.push(["Daftar / cek status keanggotaan koperasi", "anggota.html"]);
    openMod(`<h3>Portal Anda</h3><p>${esc(email)}</p>
      ${c.length ? c.map(([t, h]) => `<a class="btn b-red" href="${h}" style="display:block;margin:8px 0;text-align:center">${esc(t)} ➜</a>`).join("") : "<p>Akun ini belum memiliki akses portal. Hubungi pengurus KKMP.</p>"}
      <p style="margin-top:14px"><a href="#" id="lgout">Keluar dari akun</a></p>`);
  }
  async function openLogin() {
    const L = S.login || {};
    $("#sbox").classList.remove("open");
    const s = getSess();
    if (s) { try { return showPortals(await myAccess(s), s.email); } catch (e) { localStorage.removeItem(SK); } }
    openMod(`<h3>${esc(L.title || "Masuk")}</h3>
      <p>${esc(L.text || "")}</p>
      <form class="lgf" id="lgform" autocomplete="on">
        <label for="lgem">${esc(S.ui.loginEmail)}</label>
        <input class="fi" id="lgem" type="email" required autocomplete="username">
        <label for="lgpw">${esc(S.ui.loginPass)}</label>
        <input class="fi" id="lgpw" type="password" required autocomplete="current-password">
        <p id="lgerr" role="alert" style="color:#b3261e;margin:6px 0"></p>
        <button class="btn b-red" type="submit">${esc(L.label || "Masuk")}</button>
      </form>
      <p style="margin-top:12px;font-size:.9em">Belum punya akun? <a href="anggota.html#daftar">Daftar sebagai anggota koperasi</a></p>`);
    $("#lgem").focus();
  }
  $("#lgbtn").onclick = openLogin;
  document.addEventListener("click", (e) => {
    if (e.target.id !== "lgout") return;
    e.preventDefault();
    localStorage.removeItem(SK);
    closeMod();
  });
  document.addEventListener("submit", async (e) => {
    if (e.target.id !== "lgform") return;
    e.preventDefault();
    const btn = e.target.querySelector("button"), err = $("#lgerr");
    btn.disabled = true; err.textContent = "";
    try {
      if (!BASE || !KEY) throw new Error("Layanan masuk belum dikonfigurasi.");
      const s = await authCall("token?grant_type=password", { email: $("#lgem").value.trim(), password: $("#lgpw").value });
      const a = await myAccess(s);
      const c = (a.stores || []).length + (a.admin ? 1 : 0) + (a.coop ? 1 : 0);
      if (c === 1) return void (location.href = a.admin ? "admin.html" : a.coop ? "anggota.html" : "mitra.html?toko=" + a.stores[0].id);
      showPortals(a, s.email);
    } catch (er) { err.textContent = er.message; btn.disabled = false; }
  });
  function syncPins() {
    const m = { Warung: "warung", Toko: "toko", Apotek: "apotek" };
    $$(".pin[data-k]").forEach((x) => x.classList.toggle("dim", !!m[PF] && x.dataset.k !== m[PF]));
  }
  function enhance() {
    clearInterval(auto);
    if (io) io.disconnect();
    const nd = $$(".nd");
    if (nd.length && !RM) {
      let i = 1;
      auto = setInterval(() => {
        i = (i + 1) % nd.length;
        nd[i].click();
      }, 4200);
      $(".nodes") && $(".nodes").addEventListener("pointerdown", () => clearInterval(auto), { once: true });
    }
    if (!RM && "IntersectionObserver" in window) {
      io = new IntersectionObserver((en) => en.forEach((x) => {
        if (x.isIntersecting) {
          const t = x.target;
          t.classList.add("in");
          io.unobserve(t);
          setTimeout(() => t.classList.remove("rv", "in"), 750);
        }
      }), { threshold: 0.1 });
      $$("#app .row,#app .c1,#app .cat,#app .pd,#app .po,#app .nw,#app .dc,#app .pp,#app .ci,#app details,#app .map,#app .nodes,#app .card,#app .qg,#app .idg,#app .vm").forEach((el) => {
        el.classList.add("rv");
        io.observe(el);
      });
    }
    syncPins();
  }
  $("#sin").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase(), b = S.pages.katalog.blocks.find((x) => x.t === "catalog");
    $("#sug").innerHTML = q ? b.items.filter((p) => (p.n + " " + p.c).toLowerCase().includes(q)).slice(0, 5).map((p) => `<button data-sp="${esc(p.n)}">${p.e || ""} ${esc(p.n)} <small style="color:var(--mut)">· ${esc(p.c)}</small></button>`).join("") : "";
  });
  $("#sug").addEventListener("click", (e) => {
    const b = e.target.closest("[data-sp]");
    if (b) {
      prodModal(b.dataset.sp);
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      closeMod();
      $("#sbox").classList.remove("open");
    }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".pd[data-pn]")) {
      e.preventDefault();
      prodModal(e.target.dataset.pn);
    }
  });
  document.addEventListener("toggle", (e) => {
    if (e.target.tagName === "DETAILS" && e.target.open) $$("details").forEach((d) => {
      if (d !== e.target) d.open = false;
    });
  }, true);
  addEventListener("scroll", () => {
    const y = scrollY || document.documentElement.scrollTop;
    $("header").classList.toggle("sc", y > 8);
    $("#top").classList.toggle("show", y > 500);
  }, { passive: true });
  $("#top").onclick = () => scrollTo({ top: 0, behavior: RM ? "auto" : "smooth" });
  addEventListener("hashchange", () => {
    const h = (location.hash.match(/#\/(\w+)/) || [])[1];
    if (h && h !== cur) show(h);
  });
  if (!RM) {
    let r;
    document.addEventListener("pointermove", (e) => {
      const h = e.target.closest && e.target.closest(".hero .hpic");
      if (h) {
        const b = h.getBoundingClientRect(), x = (e.clientX - b.left) / b.width - 0.5, y = (e.clientY - b.top) / b.height - 0.5;
        const p = h.querySelector(".pic");
        p.style.transform = `scale(1.05) translate(${-x * 14}px,${-y * 10}px)`;
        p.style.transition = "transform .15s";
      }
      const c = e.target.closest && e.target.closest(".pd,.po,.cat,.dc,.c1");
      if (c && e.pointerType === "mouse") {
        const b = c.getBoundingClientRect(), x = (e.clientX - b.left) / b.width - 0.5, y = (e.clientY - b.top) / b.height - 0.5;
        c.style.transition = "transform .12s";
        c.style.transform = `translateY(-4px) perspective(700px) rotateX(${-y * 5}deg) rotateY(${x * 5}deg)`;
      }
    });
    document.addEventListener("pointerout", (e) => {
      const c = e.target.closest && e.target.closest(".pd,.po,.cat,.dc,.c1");
      if (c) {
        c.style.transform = "";
        c.style.transition = "";
      }
      const h = e.target.closest && e.target.closest(".hero .hpic");
      if (h && !(e.relatedTarget && h.contains(e.relatedTarget))) {
        const p = h.querySelector(".pic");
        p.style.transform = "";
      }
    });
  }
  // ----- Data dinamis dari Supabase (opsional) -----
  // Jika config.js valid, produk, mitra, pengumuman, dan dokumentasi dibaca dari database
  // dan dikelola lewat admin.html. Jika kosong, tidak valid, atau gagal dimuat, data contoh dipakai.
  const CFG = window.KKMP_CONFIG || {};
  const BASE = String(CFG.SUPABASE_URL || "").replace(/\/+$/, "");
  const KEY = String(CFG.SUPABASE_ANON_KEY || "").trim();
  const validProjectUrl = (value) => {
    try {
      const url = new URL(value);
      return url.protocol === "https:" && /^[a-z0-9-]+\.supabase\.co$/.test(url.hostname) &&
        url.pathname === "/" && !url.search && !url.hash;
    } catch {
      return false;
    }
  };
  const validPublicKey =
    /^eyJ[\w-]+\.[\w-]+\.[\w-]+$/.test(KEY) || /^sb_publishable_[\w-]+$/.test(KEY);
  const REMOTE = validProjectUrl(BASE) && validPublicKey;
  const BULAN = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
  const BULAN_PANJANG = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

  // "2025-01-12" -> "12 Jan 2025"
  const fmtDate = (v) => {
    const m = String(v || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? `${+m[3]} ${BULAN[+m[2] - 1]} ${m[1]}` : "";
  };
  // timestamp -> "12 Januari 2025"
  const fmtLong = (v) => {
    const d = new Date(v);
    return isNaN(d) ? "" : `${d.getDate()} ${BULAN_PANJANG[d.getMonth()]} ${d.getFullYear()}`;
  };

  async function sbGet(table, query) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 8000);
    try {
      const res = await fetch(`${BASE}/rest/v1/${table}?${query}`, {
        // kunci lama (anon, berformat JWT "eyJ...") dikirim juga sebagai Bearer; kunci baru (sb_publishable_...) cukup lewat apikey
        headers: /^eyJ/.test(KEY)
          ? { apikey: KEY, Authorization: "Bearer " + KEY }
          : { apikey: KEY },
        signal: ctl.signal
      });
      if (!res.ok) throw new Error(table + " " + res.status);
      return await res.json();
    } finally {
      clearTimeout(timer);
    }
  }

  // Daftar kategori: urutan dari SITE dulu, kategori baru dari database ditambahkan di belakang
  const mergeCats = (first, known, used) => [
    first,
    ...known.filter((c) => c !== first),
    ...[...new Set(used)].filter((c) => c && !known.includes(c))
  ];
  const newest = (rows) => rows.map((r) => r.updated_at || r.created_at || "").sort().pop();

  // Menimpa bagian SITE dengan isi tabel site_content (dikelola di admin.html > Teks & Pengaturan).
  // Hanya kolom yang diizinkan yang diterapkan; kolom lain pada data SITE tidak tersentuh.
  const pickKeys = (v, keys) =>
    Object.fromEntries(keys.filter((k) => v && typeof v === "object" && k in v).map((k) => [k, v[k]]));

  function applySite(rows) {
    const doc = {};
    (rows || []).forEach((r) => (doc[r.key] = r.value || {}));
    const put = (target, v, keys) => Object.assign(target, pickKeys(v, keys));

    if (doc.menu && Array.isArray(doc.menu.nav)) S.nav = doc.menu.nav;
    put(S.brand, doc.brand, ["name", "tagline", "logo", "emoji", "siteTitle", "favicon"]);
    put(S.theme, doc.theme, Object.keys(S.theme));
    put(S.ui, doc.ui, Object.keys(S.ui));
    put(S.footer, doc.footer, ["desc", "contact", "social", "note"]);
    put(S, doc.peta, ["mapImg", "mapEmbed", "mapEmbedKkmp", "mapNote"]);
    if (doc.pins && Array.isArray(doc.pins.pins)) S.pins = doc.pins.pins;

    Object.keys(S.pages).forEach((p) =>
      put(S.pages[p].hero, doc["hero_" + p], ["label", "h1", "accent", "text", "b1", "b2", "img", "quote", "cap", "red"])
    );

    // Isi blok tiap halaman, kotak ajakan (CTA), urutan blok, dan bagian tambahan
    const BLOCK_KEYS = ["label", "title", "sub", "text", "btn", "pill", "more", "side", "legend", "legnote", "note", "cats", "info", "limit"];
    Object.keys(S.pages).forEach((p) => {
      const pg = S.pages[p], d = doc["page_" + p] || {}, bd = d.blocks || {};
      if (d.cta && typeof d.cta === "object") put(pg.cta, d.cta, ["emoji", "title", "text", "btn"]);
      if (Array.isArray(d.order)) pg.order = d.order.filter((x) => typeof x === "string" && x);
      if (Array.isArray(d.custom)) pg.custom = d.custom;
      pg.blocks.forEach((b) => {
        const v = bd[b.t];
        if (!v || typeof v !== "object") return;
        const keys = BLOCK_KEYS.slice();
        // produk, mitra, pengumuman, dan dokumentasi dikelola lewat tabelnya sendiri
        if (!["catalog", "dir", "posts"].includes(b.t) && b.src !== "gallery") keys.push("items");
        put(b, v, keys);
        if ("side" in v && v.side && !v.side.title && !v.side.text) b.side = null;
        if (b.t === "catalog" && v.info && v.info.upd) b.info.updFixed = true;
      });
    });
    S.pages.profil.blocks.forEach((b) => put(b, (doc.profil || {})[b.t], ["label", "title", "text", "items", "rows", "note", "img", "video"]));
    S.pages.kontak.blocks
      .filter((b) => b.t === "faqc")
      .forEach((b) => put(b, doc.kontak, ["faqTitle", "faq", "ctitle", "contact", "btn"]));
    put(S.login, doc.login, ["label", "title", "text"]);
    put(UNITS, doc.units, ["label", "title", "sub", "items"]);
  }

  // ----- Harga & stok dari aplikasi kasir toko mitra (view catalog_toko) -----
  const TK = { at: "Dijual di:", ok: "Tersedia", lo: "Stok menipis", zero: "Habis", sortPrice: "Harga terendah", sortReady: "Tersedia dulu", note: "Harga dan stok diperbarui langsung oleh toko mitra dan dapat berubah sewaktu-waktu. Hubungi toko untuk memastikan sebelum datang." };
  const rpf = (n) => "Rp" + Math.round(+n || 0).toLocaleString("id-ID");
  const stk = (p) => {
    const q = (+p.stock).toLocaleString("id-ID", { maximumFractionDigits: 2 }) + (p.u ? " " + p.u.replace(/^per\s+/i, "") : "");
    return p.stock <= 0 ? `<span class="sk zero">${TK.zero}</span>` : p.stock <= p.min ? `<span class="sk lo">${TK.lo} · sisa ${esc(q)}</span>` : `<span class="sk ok">${TK.ok} · ${esc(q)}</span>`;
  };

  async function loadRemote() {
    if (!REMOTE) return false;
    try {
      const on = "is_active=eq.true";
      const [prod, mitra, post, gal, site, toko] = await Promise.all([
        sbGet("products", `select=*&${on}&order=sort_order.asc,name.asc`),
        sbGet("partners", `select=*&${on}&order=sort_order.asc,name.asc`),
        sbGet("posts", `select=*&${on}&order=published_at.desc,id.desc&limit=50`),
        sbGet("gallery", `select=*&${on}&order=event_date.desc,id.desc&limit=50`),
        // teks & pengaturan situs: jika tabel belum ada, bagian ini dilewati (data SITE dipakai)
        sbGet("site_content", "select=key,value").catch(() => []),
        // katalog dari stok toko (jika 06_katalog_publik.sql belum dijalankan: dilewati, katalog lama dipakai)
        sbGet("catalog_toko", "select=*&order=name.asc&limit=1000").catch(() => [])
      ]);
      applySite(site);

      Object.values(S.pages)
        .flatMap((p) => p.blocks)
        .forEach((b) => {
          if (b.t === "catalog") {
            const src = toko.length ? toko : prod;
            b.items = toko.length
              ? toko.map((r) => ({ k: "t" + r.id, n: r.name, c: r.category, u: r.unit || "", d: r.description || "", img: r.image_url || "", price: +r.sell_price, stock: +r.stock, min: +r.min_stock, store: r.store_name }))
              : prod.map((r) => ({ n: r.name, c: r.category, u: r.unit || "", d: r.description || "", img: r.image_url || "" }));
            if (toko.length) b.note = "Harga dan stok berasal dari toko mitra KKMP Jelupang dan diperbarui langsung oleh pengelola toko.";
            b.cats = mergeCats(b.cats[0] || "Semua Produk", b.cats, src.map((r) => r.category));
            const last = fmtLong(newest(src));
            if (last && !b.info.updFixed) b.info.upd = "Pembaruan terakhir: " + last;
          } else if (b.t === "dir") {
            b.items = mitra.map((r) => ({ n: r.name, c: r.category, a: r.address || "", img: r.image_url || "" }));
            b.cats = mergeCats(b.cats[0] || "Semua", b.cats, mitra.map((r) => r.category));
          } else if (b.t === "posts") {
            const n = b.limit || 3;
            b.items = post.slice(0, n).map((r) => ({
              tag: r.tag || "Informasi",
              date: fmtDate(r.published_at),
              title: r.title,
              text: r.text || "",
              img: r.image_url || "",
              link: r.link || ""
            }));
          } else if (b.t === "tiles" && b.src === "gallery") {
            const n = b.limit || 3;
            b.items = gal.slice(0, n).map((r) => ({ title: r.title, sub: fmtDate(r.event_date), img: r.image_url || "" }));
          }
        });
      return true;
    } catch (e) {
      console.warn("Data dinamis gagal dimuat, memakai data contoh.", e);
      return false;
    }
  }

  // ----- Mulai -----
  const start = () => {
    applyTheme();
    renderChrome();
    show((location.hash.match(/#\/(\w+)/) || [])[1] || "beranda");
  };
  if (REMOTE) {
    $("#app").innerHTML = '<div class="wrap"><p class="nt" style="padding:90px 0;text-align:center">Memuat data…</p></div>';
    loadRemote().then(start, start);
  } else {
    start();
  }
  </script>
</body>
</html>
